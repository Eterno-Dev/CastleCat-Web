<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Castle Cat - Web Version</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background-color: #111;
            color: #eee;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #console {
            width: 100vw;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 16px;
            line-height: 1.1;
        }

        /* Reglas individuales para pantalla completa (evita descarte de selectores por el navegador) */
        :fullscreen #console {
            font-size: 25px !important;
            line-height: 1.25 !important;
        }

        :-webkit-full-screen #console {
            font-size: 25px !important;
            line-height: 1.25 !important;
        }

        :-moz-full-screen #console {
            font-size: 25px !important;
            line-height: 1.25 !important;
        }

        @media (display-mode: fullscreen) {
            #console {
                font-size: 25px !important;
                line-height: 1.25 !important;
            }
        }

        body.fullscreen-mode #console,
        html.fullscreen-mode #console {
            font-size: 25px !important;
            line-height: 1.25 !important;
        }

        @keyframes screen-shake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-4px, 3px); }
            40% { transform: translate(4px, -3px); }
            60% { transform: translate(-3px, -2px); }
            80% { transform: translate(3px, 3px); }
            100% { transform: translate(0, 0); }
        }

        .shake {
            animation: screen-shake 0.2s ease-in-out;
        }

        @keyframes screen-shake-death {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); filter: contrast(100%); }
            10% { transform: translate(-20px, 16px) rotate(-3.5deg) scale(1.04); filter: contrast(180%) brightness(1.2); }
            20% { transform: translate(22px, -18px) rotate(3.5deg) scale(1.06); filter: contrast(220%) hue-rotate(25deg); }
            30% { transform: translate(-24px, 20px) rotate(-4deg) scale(1.05); filter: contrast(200%); }
            40% { transform: translate(22px, -16px) rotate(3deg) scale(1.04); }
            50% { transform: translate(-18px, 14px) rotate(-2.5deg) scale(1.03); filter: contrast(160%); }
            60% { transform: translate(16px, -12px) rotate(2deg) scale(1.02); }
            70% { transform: translate(-12px, 8px) rotate(-1.5deg) scale(1.01); }
            80% { transform: translate(8px, -6px) rotate(1deg) scale(1.01); }
            90% { transform: translate(-4px, 3px) rotate(-0.5deg) scale(1); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1); filter: contrast(100%); }
        }

        .shake-death {
            animation: screen-shake-death 0.85s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* ANSI Colors */
        .ansi-30 {
            color: #000000;
        }

        .ansi-31 {
            color: #ff5555;
        }

        .ansi-32 {
            color: #55ff55;
        }

        .ansi-33 {
            color: #ffff55;
        }

        .ansi-34 {
            color: #5555ff;
        }

        .ansi-35 {
            color: #ff55ff;
        }

        .ansi-36 {
            color: #55ffff;
        }

        .ansi-37 {
            color: #ffffff;
        }

        .ansi-40 {
            background-color: #000000;
        }

        .ansi-44 {
            background-color: #0000AA;
        }

        .ansi-47 {
            background-color: #AAAAAA;
        }

        .ansi-41 {
            background-color: #ff5555;
        }

        .ansi-42 {
            background-color: #55ff55;
        }

        .ansi-43 {
            background-color: #ffff55;
        }

        .ansi-45 {
            background-color: #ff55ff;
        }

        .ansi-46 {
            background-color: #55ffff;
        }

        .ansi-1 {
            font-weight: bold;
        }

        .ansi-4 {
            text-decoration: underline;
        }

        /* Loading Overlay */
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            z-index: 100;
        }

        #top-bar {
            position: absolute;
            top: 10px;
            right: 12px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            user-select: none;
        }

        #vol-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(25, 25, 25, 0.85);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #444;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            user-select: none;
        }

        /* Botón interactivo TAB con tipografía del juego */
        .tab-badge {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            font-weight: bold;
            display: none;
            align-items: center;
            gap: 6px;
            background: rgba(22, 22, 22, 0.9);
            padding: 4px 10px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            outline: none;
            user-select: none;
        }

        .tab-cap {
            display: inline-block;
            font-size: 9px;
            font-weight: 900;
            padding: 1px 4px;
            border-radius: 3px;
            letter-spacing: 0.5px;
        }

        .tab-skip-mode {
            border: 1px solid #ff4444;
            color: #ffcccc;
            animation: tabSkipPulse 1.1s infinite ease-in-out;
        }

        .tab-skip-mode .tab-cap {
            background: #aa2222;
            color: #ffffff;
            border: 1px solid #ff7777;
        }

        .tab-skip-mode:hover {
            background: rgba(70, 20, 20, 0.95);
            transform: scale(1.05);
        }

        .tab-menu-mode {
            border: 1px solid #3388ff;
            color: #cce0ff;
            animation: tabMenuBlink 2.2s infinite ease-in-out;
        }

        .tab-menu-mode .tab-cap {
            background: #113366;
            color: #ffffff;
            border: 1px solid #5599ff;
        }

        .tab-menu-mode:hover {
            background: rgba(20, 40, 75, 0.95);
            transform: scale(1.05);
        }

        @keyframes tabSkipPulse {
            0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 8px rgba(255, 68, 68, 0.55); }
            50% { opacity: 0.45; transform: scale(0.96); box-shadow: 0 0 2px rgba(255, 68, 68, 0.15); }
        }

        @keyframes tabMenuBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        #vol-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 75px;
            height: 5px;
            background: #555;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            vertical-align: middle;
        }

        #vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 3px rgba(0,0,0,0.6);
            transition: transform 0.1s;
        }
        #vol-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        #vol-slider::-moz-range-thumb {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 3px rgba(0,0,0,0.6);
        }

        /* Filtro Retro CRT / Scanlines sutiles */
        body.retro-filter::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.16),
                rgba(0, 0, 0, 0.16) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 999;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.4);
        }

        @keyframes scanlines-drift {
            0% { background-position: 0 0; }
            100% { background-position: 0 30px; }
        }

        body.retro-filter.retro-animated::after {
            animation: scanlines-drift 3.5s linear infinite;
        }

        body.retro-filter #console {
            text-shadow: 0 0 1px rgba(255, 255, 255, 0.35);
        }
    </style>
</head>

<body>
    <div id="top-bar">
        <button id="tab-btn" class="tab-badge" onclick="handleTabAction()" style="display: none;">
            <span class="tab-cap">TAB</span><span id="tab-label">Saltar</span>
        </button>
        <div id="vol-control">
            <button id="mute-btn" style="background:transparent; color:#ccc; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;" onclick="toggleMute()" title="Silenciar / Activar">
                <svg id="vol-icon" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z" /></svg>
            </button>
            <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="1.0" title="Sonido General" oninput="setWebVolume(this.value)">
        </div>
        <button id="fs-btn" style="background:transparent; color:white; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;" onclick="toggleFS()"><svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="24" height="24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" /></svg></button>
    </div>
    <audio id="bgm" loop>
        <source src="Music.mp3" type="audio/mpeg">
        <source src="music.mp3" type="audio/mpeg">
        <source src="assets/Music.mp3" type="audio/mpeg">
        <source src="assets/music.mp3" type="audio/mpeg">
        <source src="../assets/Music.mp3" type="audio/mpeg">
        <source src="../assets/music.mp3" type="audio/mpeg">
    </audio>
    <script>
        window.masterVolume = 1.0;
        window.musicTrackVolume = 0.5;
        window.sfxTrackVolume = 0.6;
        window.sfxVolume = 0.6;
        window.sfxMuted = false;
        var previousVolume = 1.0;

        // Gestión de botón interactivo TAB (Saltar historia / Abrir menú)
        window.tabMode = 'hidden';
        window.canSkipNarrative = false;
        window.skipNarrative = false;
        window.inGameplay = false;

        window.setTabMode = function(mode) {
            window.tabMode = mode;
            var btn = document.getElementById('tab-btn');
            if (!btn) return;
            if (mode === 'skip') {
                btn.style.display = 'inline-flex';
                btn.className = 'tab-badge tab-skip-mode';
                btn.innerHTML = '<span class="tab-cap">TAB</span><span>Saltar</span>';
                btn.title = "Pulsa TAB o haz clic para saltar la historia";
            } else if (mode === 'menu') {
                btn.style.display = 'inline-flex';
                btn.className = 'tab-badge tab-menu-mode';
                btn.innerHTML = '<span class="tab-cap">TAB</span><span>Menú</span>';
                btn.title = "Pulsa TAB o haz clic para abrir el menú";
            } else {
                btn.style.display = 'none';
            }
        };

        window.handleTabAction = function() {
            if (window.tabMode === 'skip') {
                window.skipNarrative = true;
                if (typeof window.playSound === 'function') {
                    window.playSound('confirm');
                }
            } else if (window.tabMode === 'menu') {
                if (typeof Module !== 'undefined' && Module._triggerMenuTab) {
                    Module._triggerMenuTab();
                } else if (typeof triggerMenuTab === 'function') {
                    triggerMenuTab();
                }
            }
        };

        // Gestión de Filtro Retro CRT (0 = Desactivado, 1 = Activado, 2 = Dinámico)
        window.setRetroMode = function(mode) {
            mode = parseInt(mode);
            if (mode === 2) { // Dinámico (con líneas animadas sutiles)
                document.body.classList.add('retro-filter');
                document.body.classList.add('retro-animated');
                try { localStorage.setItem('castlecat_retro_mode', '2'); } catch(e){}
            } else if (mode === 1) { // Activado (estático)
                document.body.classList.add('retro-filter');
                document.body.classList.remove('retro-animated');
                try { localStorage.setItem('castlecat_retro_mode', '1'); } catch(e){}
            } else { // Desactivado
                document.body.classList.remove('retro-filter');
                document.body.classList.remove('retro-animated');
                try { localStorage.setItem('castlecat_retro_mode', '0'); } catch(e){}
            }
        };

        window.getRetroMode = function() {
            if (document.body.classList.contains('retro-animated')) return 2;
            if (document.body.classList.contains('retro-filter')) return 1;
            return 0;
        };

        window.setRetroFilter = function(enabled) {
            window.setRetroMode(enabled ? (window.getRetroMode() === 2 ? 2 : 1) : 0);
        };

        window.setRetroAnimation = function(enabled) {
            window.setRetroMode(enabled ? 2 : (document.body.classList.contains('retro-filter') ? 1 : 0));
        };

        window.isRetroFilterEnabled = function() {
            return document.body.classList.contains('retro-filter');
        };

        window.isRetroAnimationEnabled = function() {
            return document.body.classList.contains('retro-animated');
        };

        try {
            var savedMode = localStorage.getItem('castlecat_retro_mode');
            if (savedMode !== null) {
                window.setRetroMode(savedMode);
            } else if (localStorage.getItem('castlecat_retro_filter') === '1') {
                window.setRetroMode(localStorage.getItem('castlecat_retro_animated') === '1' ? 2 : 1);
            }
        } catch(e){}

        // Set initial BGM volume to 50%
        var bgmInit = document.getElementById('bgm');
        if (bgmInit) {
            bgmInit.volume = 0.5;
        }
        
        // ==========================================
        // SISTEMA DE AUDIO DE BAJA LATENCIA (Web Audio API)
        // ==========================================
        var audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                var AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) {
                    audioCtx = new AudioCtx();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(function() {});
            }
            return audioCtx;
        }

        // Desbloquear AudioContext en la primera interaccion
        ['keydown', 'mousedown', 'touchstart', 'click'].forEach(function(evt) {
            window.addEventListener(evt, function() {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(function() {});
                }
            }, { capture: true, passive: true });
        });

        // Búferes precargados en memoria RAM
        var soundBuffers = {};

        // Sintetizar inmediatamente en memoria el sonido del glitch a t=0 (0ms delay)
        function getGlitchBuffer(ctx) {
            if (!ctx) return null;
            if (soundBuffers['glitch']) return soundBuffers['glitch'];
            var dur = 0.35;
            var sr = ctx.sampleRate || 44100;
            var len = Math.floor(sr * dur);
            var buf = ctx.createBuffer(1, len, sr);
            var data = buf.getChannelData(0);
            for (var i = 0; i < len; i++) {
                var t = i / sr;
                var env = 1.0;
                if (i < 200) env = i / 200.0;
                else if (i > len - 800) env = (len - i) / 800.0;
                var white = (Math.random() * 2.0 - 1.0);
                var hum = 0.22 * Math.sin(2 * Math.PI * 60 * t) + 0.12 * Math.sin(2 * Math.PI * 120 * t);
                var crackle = (Math.random() < 0.08) ? (Math.random() * 2.0 - 1.0) * 0.45 : 0;
                data[i] = (white * 0.65 + hum + crackle) * env * 0.85;
            }
            soundBuffers['glitch'] = buf;
            return buf;
        }

        // Precargar archivo de audio en un AudioBuffer
        function preloadAudioBuffer(name, paths) {
            var ctx = getAudioContext();
            if (!ctx) return;
            function tryFetch(idx) {
                if (idx >= paths.length) return;
                fetch(paths[idx])
                    .then(function(res) {
                        if (!res.ok) throw new Error("HTTP " + res.status);
                        return res.arrayBuffer();
                    })
                    .then(function(ab) {
                        return ctx.decodeAudioData(ab);
                    })
                    .then(function(decoded) {
                        soundBuffers[name] = decoded;
                    })
                    .catch(function() {
                        tryFetch(idx + 1);
                    });
            }
            tryFetch(0);
        }

        // Definición de sonidos del juego
        var soundPathsMap = {
            'confirm': ["Confirm.mp3", "confirm.mp3", "assets/Confirm.mp3", "assets/confirm.mp3"],
            'next_option': ["NextOption.mp3", "nextoption.mp3", "assets/NextOption.mp3", "assets/nextoption.mp3"],
            'volume': ["Volume.mp3", "volume.mp3", "assets/Volume.mp3", "assets/volume.mp3"],
            'potion': ["sfx_potion.wav", "SFX/sfx_potion.wav", "assets/sfx_potion.wav", "assets/SFX/sfx_potion.wav"],
            'platano': ["sfx_platano.wav", "SFX/sfx_platano.wav", "assets/sfx_platano.wav", "assets/SFX/sfx_platano.wav"],
            'death': ["sfx_death.wav", "SFX/sfx_death.wav", "assets/sfx_death.wav", "assets/SFX/sfx_death.wav"],
            'glitch': ["sfx_glitch.wav", "SFX/sfx_glitch.wav", "assets/sfx_glitch.wav", "assets/SFX/sfx_glitch.wav"]
        };
        for (var i = 1; i <= 3; i++) {
            soundPathsMap['sfx_hit_' + i] = ["sfx_hit_" + i + ".wav", "SFX/sfx_hit_" + i + ".wav", "assets/sfx_hit_" + i + ".wav"];
            soundPathsMap['sfx_chest_' + i] = ["sfx_chest_" + i + ".wav", "SFX/sfx_chest_" + i + ".wav", "assets/sfx_chest_" + i + ".wav"];
            soundPathsMap['sfx_atk_basic_' + i] = ["sfx_atk_basic_" + i + ".wav", "SFX/sfx_atk_basic_" + i + ".wav", "assets/sfx_atk_basic_" + i + ".wav"];
        }
        for (var i = 1; i <= 2; i++) {
            soundPathsMap['sfx_atk_str_' + i] = ["sfx_atk_str_" + i + ".wav", "SFX/sfx_atk_str_" + i + ".wav", "assets/sfx_atk_str_" + i + ".wav"];
            soundPathsMap['sfx_atk_mag_' + i] = ["sfx_atk_mag_" + i + ".wav", "SFX/sfx_atk_mag_" + i + ".wav", "assets/sfx_atk_mag_" + i + ".wav"];
            soundPathsMap['sfx_atk_agi_' + i] = ["sfx_atk_agi_" + i + ".wav", "SFX/sfx_atk_agi_" + i + ".wav", "assets/sfx_atk_agi_" + i + ".wav"];
        }

        // Iniciar precarga de todos los sonidos inmediatamente
        for (var k in soundPathsMap) {
            preloadAudioBuffer(k, soundPathsMap[k]);
        }

        window.playSound = function(type) {
            if (window.sfxMuted) return;

            var resolvedKey = "";
            if (type === 'confirm' || type === 'next_option' || type === 'death' || type === 'potion' || type === 'glitch') {
                resolvedKey = type;
            } else if (type === 'platano' || type === 'banana') {
                resolvedKey = 'platano';
            } else if (type === 'volume' || type === 'less_volume' || type === 'more_volume') {
                resolvedKey = 'volume';
            } else if (type === 'hit') {
                resolvedKey = 'sfx_hit_' + (Math.floor(Math.random() * 3) + 1);
            } else if (type === 'chest') {
                resolvedKey = 'sfx_chest_' + (Math.floor(Math.random() * 3) + 1);
            } else if (type === 'atk_basic') {
                resolvedKey = 'sfx_atk_basic_' + (Math.floor(Math.random() * 3) + 1);
            } else if (type === 'atk_str') {
                resolvedKey = 'sfx_atk_str_' + (Math.floor(Math.random() * 2) + 1);
            } else if (type === 'atk_mag') {
                resolvedKey = 'sfx_atk_mag_' + (Math.floor(Math.random() * 2) + 1);
            } else if (type === 'atk_agi') {
                resolvedKey = 'sfx_atk_agi_' + (Math.floor(Math.random() * 2) + 1);
            } else {
                resolvedKey = type.startsWith('sfx_') ? type : 'sfx_' + type;
            }

            var ctx = getAudioContext();
            var targetVol = (typeof window.sfxVolume === 'number') ? window.sfxVolume : 0.5;

            // Reproduccion con Web Audio API: 0ms de latencia
            if (ctx) {
                var buf = (resolvedKey === 'glitch') ? (soundBuffers['glitch'] || getGlitchBuffer(ctx)) : soundBuffers[resolvedKey];
                if (buf) {
                    try {
                        var src = ctx.createBufferSource();
                        src.buffer = buf;
                        var gain = ctx.createGain();
                        gain.gain.value = targetVol;
                        src.connect(gain);
                        gain.connect(ctx.destination);
                        src.start(0);
                        return;
                    } catch(e) {}
                }
            }

            // Fallback con HTML5 Audio si aun no ha terminado de decodificar en RAM
            var pathsToTry = soundPathsMap[resolvedKey] || [resolvedKey + '.wav', 'SFX/' + resolvedKey + '.wav'];
            function tryPlay(idx) {
                if (idx >= pathsToTry.length) return;
                var audio = new Audio();
                var failed = false;
                audio.onerror = function() {
                    if (!failed) { failed = true; tryPlay(idx + 1); }
                };
                audio.src = pathsToTry[idx];
                audio.volume = targetVol;
                var p = audio.play();
                if (p && typeof p.catch === 'function') {
                    p.catch(function() {
                        if (!failed) { failed = true; tryPlay(idx + 1); }
                    });
                }
            }
            tryPlay(0);
        };

        window.screenShake = function(heavy) {
            var c = document.getElementById('console');
            if (!c) return;
            c.classList.remove('shake');
            c.classList.remove('shake-death');
            void c.offsetWidth; // trigger reflow
            if (heavy) {
                c.classList.add('shake-death');
                setTimeout(function() {
                    c.classList.remove('shake-death');
                }, 900);
            } else {
                c.classList.add('shake');
                setTimeout(function() {
                    c.classList.remove('shake');
                }, 250);
            }
        };

        function applyAudioVolumes() {
            var effectiveBgm = window.sfxMuted ? 0 : (window.masterVolume * window.musicTrackVolume);
            var effectiveSfx = window.sfxMuted ? 0 : (window.masterVolume * window.sfxTrackVolume);

            var bgm = document.getElementById('bgm');
            if (bgm) {
                bgm.volume = Math.max(0, Math.min(1, effectiveBgm));
                if (effectiveBgm > 0 && !window.sfxMuted) bgm.muted = false;
                else if (window.sfxMuted) bgm.muted = true;
            }
            window.sfxVolume = Math.max(0, Math.min(1, effectiveSfx));
            updateVolumeUI(window.masterVolume);
        }

        function setWebVolume(val) {
            var v = parseFloat(val);
            if (isNaN(v)) v = 1.0;
            v = Math.max(0, Math.min(1, v));
            window.masterVolume = v;
            window.sfxMuted = (v <= 0);
            if (window.inOptionsMenu) {
                window.volumeSliderChanged = true;
            }
            applyAudioVolumes();
            tryStartAudio();
        }
        window.setWebVolume = setWebVolume;

        window.setMasterVolume = function(val) {
            setWebVolume(val);
        };
        window.setMusicVolume = function(val) {
            var v = parseFloat(val);
            if (!isNaN(v)) window.musicTrackVolume = Math.max(0, Math.min(1, v));
            applyAudioVolumes();
        };
        window.setSfxVolume = function(val) {
            var v = parseFloat(val);
            if (!isNaN(v)) window.sfxTrackVolume = Math.max(0, Math.min(1, v));
            applyAudioVolumes();
        };

            } else {
                btn.innerHTML = '<svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z" /></svg>';
            }

        function toggleMute() {
            if (window.sfxMuted || window.masterVolume <= 0) {
                var target = previousVolume > 0 ? previousVolume : 1.0;
                window.sfxMuted = false;
                window.masterVolume = target;
                if (window.inOptionsMenu) window.volumeSliderChanged = true;
                applyAudioVolumes();
                tryStartAudio();
            } else {
                if (window.masterVolume > 0) previousVolume = window.masterVolume;
                window.sfxMuted = true;
                if (window.inOptionsMenu) window.volumeSliderChanged = true;
                applyAudioVolumes();
            }
        }
        
        var ICON_ENTER_FS = '<svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="24" height="24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" /></svg>';
        var ICON_EXIT_FS = '<svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="24" height="24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4.5M9 9H4.5M9 9 3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5 5.25 5.25" /></svg>';

        function isFullscreen() {
            var standardFS = !!(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement
            );
            if (standardFS) return true;

            if (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) {
                return true;
            }

            var wDiff = Math.abs(window.innerWidth - screen.width);
            var hDiff = Math.abs(window.innerHeight - screen.height);
            if (wDiff <= 35 && hDiff <= 35) {
                return true;
            }

            return false;
        }

        function updateFullscreenUI() {
            var inFS = isFullscreen();
            var btn = document.getElementById('fs-btn');
            var consoleDiv = document.getElementById('console');

            if (inFS) {
                document.body.classList.add('fullscreen-mode');
                document.documentElement.classList.add('fullscreen-mode');
                if (consoleDiv) {
                    var calcSize = Math.min(26, Math.max(22, Math.floor(window.innerHeight / 40)));
                    consoleDiv.style.fontSize = calcSize + 'px';
                    consoleDiv.style.lineHeight = '1.25';
                    consoleDiv.scrollTop = consoleDiv.scrollHeight;
                }
                if (btn) {
                    btn.innerHTML = ICON_EXIT_FS;
                    btn.title = "Salir de pantalla completa";
                }
            } else {
                document.body.classList.remove('fullscreen-mode');
                document.documentElement.classList.remove('fullscreen-mode');
                if (consoleDiv) {
                    consoleDiv.style.fontSize = '16px';
                    consoleDiv.style.lineHeight = '1.1';
                    consoleDiv.scrollTop = consoleDiv.scrollHeight;
                }
                if (btn) {
                    btn.innerHTML = ICON_ENTER_FS;
                    btn.title = "Pantalla completa";

        function toggleFS() {
            var bgm = document.getElementById('bgm');
            if (bgm && bgm.paused) bgm.play().catch(e => console.log('Audio autoplay prevented'));
            
            if (!isFullscreen()) {
                var el = document.documentElement;
                var rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
                if (rfs) {
                    var promise = rfs.call(el);
                    if (promise && promise.catch) {
                        promise.catch(function(err) {
                            console.log('Error al entrar a pantalla completa:', err);
                            updateFullscreenUI();
                        });
                    }
                }
            } else {
                var efs = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                if (efs) {
                    var promise = efs.call(document);
                    if (promise && promise.catch) {
                        promise.catch(function(err) {
                            console.log('Error al salir de pantalla completa:', err);
                            updateFullscreenUI();
                        });
                    }
                }
            }
            setTimeout(updateFullscreenUI, 100);
            setTimeout(updateFullscreenUI, 350);
        }

        ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function(evt) {
            document.addEventListener(evt, updateFullscreenUI);
        });
        window.addEventListener('resize', updateFullscreenUI);
        document.addEventListener('DOMContentLoaded', updateFullscreenUI);
        window.addEventListener('load', updateFullscreenUI);
        updateFullscreenUI();
        
        window.glitchPlayed = false;
        function triggerGlitchIntro() {
            if (window.glitchPlayed) return;
            window.glitchPlayed = true;

            var overlay = document.createElement('div');
            overlay.id = 'glitch-overlay';
            overlay.style.position = 'fixed';
            overlay.style.top = '0';
            overlay.style.left = '0';
            overlay.style.width = '100vw';
            overlay.style.height = '100vh';
            overlay.style.zIndex = '99999';
            overlay.style.backgroundColor = '#000';
            overlay.style.pointerEvents = 'none';
            overlay.style.overflow = 'hidden';

            var canvas = document.createElement('canvas');
            // Grano grueso de alta visibilidad exactamente como la imagen de referencia
            var w = 384, h = 216;
            canvas.width = w;
            canvas.height = h;
            canvas.style.position = 'absolute';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.display = 'block';
            canvas.style.imageRendering = 'pixelated';
            overlay.appendChild(canvas);
            document.body.appendChild(overlay);

            // Reproducir sonido de estatica de TV CRT instantaneo
            window.playSound('glitch');

            var ctx = canvas.getContext('2d');
            var startTime = performance.now();
            var animId;
            var seed = (Math.random() * 0xFFFFFF) | 0;

            var imgData = ctx.createImageData(w, h);
            var buf32 = new Uint32Array(imgData.data.buffer);

            function glitchLoop() {
                var elapsed = performance.now() - startTime;
                if (elapsed >= 350) {
                    if (animId) cancelAnimationFrame(animId);
                    overlay.style.opacity = '0';
                    overlay.style.transition = 'opacity 0.04s ease-out';
                    setTimeout(function() {
                        if (overlay && overlay.parentNode) {
                            overlay.parentNode.removeChild(overlay);
                        }
                    }, 45);

                    // Arrancar musica BGM inmediatamente tras el glitch
                    var bgm = document.getElementById('bgm');
                    var effectiveBgm = window.sfxMuted ? 0 : (window.masterVolume * window.musicTrackVolume);
                    if (bgm && !bgm.muted && effectiveBgm > 0) {
                        bgm.volume = effectiveBgm;
                        bgm.play().catch(function(e) {});
                    }
                    return;
                }

                if (ctx) {
                    var phase = elapsed * 0.025;
                    for (var y = 0; y < h; y++) {
                        // Ondas de interferencia y zumbido (hum bars) gruesas y visibles
                        var w1 = Math.sin((y + phase * 25) * 0.045) * 60;
                        var w2 = Math.sin((y + phase * 25) * 0.09 + 1.2) * 28;
                        var scanline = (y & 1) ? 8 : -8;
                        var bias = 110 + w1 + w2 + scanline;
                        var prev = bias;
                        var rowOffset = y * w;

                        for (var x = 0; x < w; x++) {
                            seed = (seed * 1664525 + 1013904223) | 0;
                            var r = (seed >>> 24);
                            var raw = bias + (r - 128) * 1.3;
                            var val = (0.7 * raw + 0.3 * prev) | 0;
                            prev = val;

                            var clp = val < 0 ? 0 : (val > 255 ? 255 : val);
                            buf32[rowOffset + x] = (255 << 24) | (clp << 16) | (clp << 8) | clp;
                        }
                    }
                    ctx.putImageData(imgData, 0, 0);
                }
                animId = requestAnimationFrame(glitchLoop);
            }
            glitchLoop();
        }

        // Start audio on first interaction if not already playing
        function tryStartAudio() {
            if (!window.glitchPlayed) {
                triggerGlitchIntro();
                return;
            }
            var bgm = document.getElementById('bgm');
            var effectiveBgm = window.sfxMuted ? 0 : (window.masterVolume * window.musicTrackVolume);
            if (bgm) {
                bgm.volume = effectiveBgm;
                if (bgm.paused && !bgm.muted && effectiveBgm > 0) {
                    bgm.play().catch(function(e) {});
                }
            }
        }
        window.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                if (window.canSkipNarrative) {
                    window.skipNarrative = true;
                    if (typeof window.playSound === 'function') {
                        window.playSound('confirm');
                    }
                } else if (window.inGameplay) {
                    if (typeof Module !== 'undefined' && Module._triggerMenuTab) {
                        Module._triggerMenuTab();
                    } else if (typeof triggerMenuTab === 'function') {
                        triggerMenuTab();
                    }
                }
            }
            tryStartAudio();
        });
        window.addEventListener('click', tryStartAudio);
    </script>

        // ANSI parsing state

        function ansiToHtml(text) {
            // Basic ANSI parser for the specific codes used in this game
            // \033[1;31m -> bold red
            // \033[0m -> reset

            var html = "";
            var parts = text.split(/\033\[/);

            for (var i = 0; i < parts.length; i++) {
                if (i === 0) {
                    html += parts[i];
                    continue;
                }

                var part = parts[i];
                var endCode = part.indexOf('m');

                if (endCode !== -1) {
                    var codes = part.substring(0, endCode).split(';');
                    var content = part.substring(endCode + 1);

                    // Process codes
                    for (var j = 0; j < codes.length; j++) {
                        var code = parseInt(codes[j]);
                        if (code === 0) {
                            html += "</span>";
                            currentStyle = ""; // Reset
                        } else {
                        }
                    }

                    // Re-implementing a simple stateful parser is better
                } else {
                    html += part;
                }
            }
            return text; // Placeholder if complex
        }

        // Stateful ANSI Parser
        // We will parse the text and maintain a list of active classes
        var activeClasses = [];

        function parseAnsi(text) {
            if (!text) return "";

            // Replace special HTML chars
            text = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

            var parts = text.split(/\033\[([0-9;]*)m/);
            var result = "";

            for (var i = 0; i < parts.length; i++) {
                var part = parts[i];

                if (i % 2 === 0) {
                    // Text content
                    if (part) {
                        var classes = activeClasses.length > 0 ? ' class="' + activeClasses.join(' ') + '"' : '';
                        result += '<span' + classes + '>' + part + '</span>';
                    }
                } else {
                    // Code segment (captured group)
                    if (part === "" || part === "0") {
                        // Reset
                        activeClasses = [];
                    } else {
                        var codes = part.split(';');
                        for (var c = 0; c < codes.length; c++) {
                            var code = parseInt(codes[c]);
                            if (code === 0) activeClasses = [];
                            else if (code === 1) activeClasses.push('ansi-1'); // Bold
                            else if (code === 4) activeClasses.push('ansi-4'); // Underline
                            else if (code >= 30 && code <= 37) {
                                // Remove existing fg colors
                                activeClasses = activeClasses.filter(cls => !cls.startsWith('ansi-3'));
                                activeClasses.push('ansi-' + code);
                            }
                            else if (code >= 40 && code <= 47) {
                                // Remove existing bg colors
                                activeClasses = activeClasses.filter(cls => !cls.startsWith('ansi-4'));
                                activeClasses.push('ansi-' + code);
                            }
                        }
                    }
                }
            }
            return result;
        }

                        var node;
                        var textNodes = [];
                        while(node = walker.nextNode()) {

                        var deletedChar = false;
                        for (var i = textNodes.length - 1; i >= 0; i--) {
                            var n = textNodes[i];
                            var content = n.textContent;
                            
                            while (content.length > 0) {
                                var lastChar = content[content.length - 1];
                                content = content.substring(0, content.length - 1);
                                n.textContent = content;
                                
                                if (lastChar !== '\n' && lastChar !== '\r') {
                                    deletedChar = true;

        };
